<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Option D — Neon Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#060606;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center; gap:32px;
  flex-wrap:wrap; padding:60px 40px 40px;
}
.label {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,.08); color:#fff; padding:6px 18px;
  border-radius:20px; font-size:12px; letter-spacing:.05em; white-space:nowrap;
}

/* ─── CARD ─── */
.card {
  width:405px; height:720px;
  background:#080808;
  border-radius:20px;
  overflow:hidden;
  display:flex; flex-direction:column;
  padding:32px 34px 28px;
  position:relative;
  flex-shrink:0;
}

/* glow blobs */
.card::before {
  content:''; position:absolute;
  bottom:-60px; left:-60px; width:320px; height:320px;
  background:radial-gradient(circle,rgba(91,141,239,.2) 0%,transparent 70%);
  pointer-events:none;
}
.card::after {
  content:''; position:absolute;
  top:-40px; right:-60px; width:240px; height:240px;
  background:radial-gradient(circle,rgba(192,132,252,.12) 0%,transparent 70%);
  pointer-events:none;
}

/* top bar */
.top-bar { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; margin-bottom:0; }
.wm { display:flex; align-items:baseline; gap:4px; }
.wm-s { font:900 13px 'Montserrat',sans-serif; color:rgba(255,255,255,.6); }
.wm-i { font:italic 17px 'Instrument Serif',serif; color:rgba(255,255,255,.6); }
.yr-badge {
  font:800 10px 'Montserrat',sans-serif; letter-spacing:.18em;
  color:#5b8def; border:1px solid rgba(91,141,239,.4);
  padding:4px 10px; border-radius:4px;
}

.spacer { flex:1; }

/* glowing rule */
.rule { position:relative; z-index:1; height:1px; margin:22px 0;
  background:linear-gradient(90deg,#5b8def 0%,rgba(91,141,239,.3) 55%,transparent 100%); }
.rule::before {
  content:''; position:absolute; left:0; top:-2px;
  width:50px; height:5px; background:#5b8def; filter:blur(4px); border-radius:4px;
}

/* content */
.content { position:relative; z-index:1; }

.dot-label { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.dot { width:7px; height:7px; border-radius:50%; background:#5b8def; flex-shrink:0;
  box-shadow:0 0 8px #5b8def,0 0 16px rgba(91,141,239,.5); }
.dot-text { font:700 10px 'Montserrat',sans-serif; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.35); }

/* name */
.dx-name {
  font:italic 60px 'Instrument Serif',serif;
  color:#fff; line-height:.95;
  word-break:break-word; overflow-wrap:break-word;
  text-shadow:0 0 40px rgba(91,141,239,.3);
  margin-bottom:10px;
}
.tagline { font:600 12px 'Montserrat',sans-serif; color:rgba(255,255,255,.35); line-height:1.4; margin-bottom:0; }

/* stat — inline, not huge */
.stat-block {
  display:inline-flex; align-items:center; gap:12px;
  background:rgba(91,141,239,.08); border:1px solid rgba(91,141,239,.2);
  border-radius:10px; padding:12px 16px;
  margin-top:22px; margin-bottom:22px;
}
.stat-num {
  font:900 36px 'Montserrat',sans-serif; letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 20%,#5b8def 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.stat-sep { width:1px; height:26px; background:rgba(91,141,239,.3); }
.stat-right {}
.stat-match { font:600 10px 'Montserrat',sans-serif; color:rgba(255,255,255,.35); letter-spacing:.08em; margin-bottom:2px; }
.stat-sev { font:800 14px 'Montserrat',sans-serif; color:#fff; text-transform:uppercase; letter-spacing:.05em; }

/* secondary — bar rows, prominent */
.sec-title { font:700 10px 'Montserrat',sans-serif; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.25); margin-bottom:12px; }
.sec-rows { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
.sec-row { }
.sec-row-top { display:flex; justify-content:space-between; margin-bottom:5px; }
.sec-row-name { font:700 14px 'Montserrat',sans-serif; color:rgba(255,255,255,.75); }
.sec-row-pct { font:900 14px 'Montserrat',sans-serif; color:#5b8def; }
.sec-track { width:100%; height:4px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; position:relative; }
.sec-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,#5b8def,#8b5cf6); }
.sec-track::after { content:''; position:absolute; inset:0; left:0; top:0; width:100%; height:100%; box-shadow:0 0 8px rgba(91,141,239,.4); }

/* artist */
.artists { font:italic 17px 'Instrument Serif',serif; color:rgba(255,255,255,.45); margin-bottom:22px; }
.artists b { font:800 11px 'Montserrat',sans-serif; color:rgba(255,255,255,.65); font-style:normal; }

/* CTA */
.cta {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  border:1px solid rgba(91,141,239,.45); border-radius:10px; padding:13px 16px;
  background:rgba(91,141,239,.08);
  box-shadow:0 0 20px rgba(91,141,239,.08),inset 0 0 20px rgba(91,141,239,.04);
}
.cta-txt { font:800 13px 'Montserrat',sans-serif; color:#fff; }
.cta-txt span { display:block; font:600 10px 'Montserrat',sans-serif; color:rgba(255,255,255,.3); letter-spacing:.1em; text-transform:uppercase; margin-top:2px; }
.cta-icon { font-size:20px; color:#5b8def; text-shadow:0 0 10px rgba(91,141,239,.8); }
</style>
</head>
<body>
<div class="label">D — Neon Noir</div>
<div class="card">
  <div class="top-bar">
    <div class="wm"><span class="wm-s">wrapped</span><span class="wm-i">therapy</span></div>
    <div class="yr-badge">2024</div>
  </div>

  <div class="spacer"></div>

  <div class="content">
    <div class="dot-label"><div class="dot"></div><div class="dot-text">Dr. Playlist diagnoses you with</div></div>
    <div class="dx-name">Depression</div>
    <div class="tagline">"Professional sad-song sommelier."</div>

    <div class="stat-block">
      <div class="stat-num">87%</div>
      <div class="stat-sep"></div>
      <div class="stat-right">
        <div class="stat-match">confidence match</div>
        <div class="stat-sev">Clinical</div>
      </div>
    </div>

    <div class="rule"></div>

    <div class="sec-title">also showing up</div>
    <div class="sec-rows">
      <div class="sec-row">
        <div class="sec-row-top"><div class="sec-row-name">Anxiety</div><div class="sec-row-pct">34%</div></div>
        <div class="sec-track"><div class="sec-fill" style="width:40%"></div></div>
      </div>
      <div class="sec-row">
        <div class="sec-row-top"><div class="sec-row-name">Insomnia</div><div class="sec-row-pct">12%</div></div>
        <div class="sec-track"><div class="sec-fill" style="width:14%"></div></div>
      </div>
    </div>

    <div class="artists">thanks to <b>Olivia Rodrigo</b> &amp; <b>The Weeknd</b></div>

    <div class="cta">
      <div class="cta-txt">Get your diagnosis<span>wrappedtherapy.com</span></div>
      <div class="cta-icon">↗</div>
    </div>
  </div>
</div>
</body>
</html>
