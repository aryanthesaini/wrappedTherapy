<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Option B — Colour Flood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d0d0d;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center; gap:32px;
  flex-wrap:wrap; padding:60px 40px 40px;
}
.label {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,.1); color:#fff; padding:6px 18px;
  border-radius:20px; font-size:12px; letter-spacing:.05em; white-space:nowrap;
}

/* ─── CARD ─── */
.card {
  width:405px; height:720px;
  background: linear-gradient(150deg, #2554cc 0%, #5b8def 40%, #8b5cf6 75%, #c084fc 100%);
  border-radius:20px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:36px 36px 30px;
  position:relative;
  flex-shrink:0;
}

/* large circle decoration — no emoji */
.deco {
  position:absolute; top:-80px; right:-80px;
  width:340px; height:340px; border-radius:50%;
  background: rgba(255,255,255,.07);
  pointer-events:none;
}
.deco2 {
  position:absolute; bottom:60px; left:-60px;
  width:220px; height:220px; border-radius:50%;
  border: 1.5px solid rgba(255,255,255,.12);
  pointer-events:none;
}

/* wordmark */
.top-bar { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
.wm { display:flex; align-items:baseline; gap:5px; }
.wm-s { font:900 14px 'Montserrat',sans-serif; color:rgba(255,255,255,.85); }
.wm-i { font:italic 19px 'Instrument Serif',serif; color:rgba(255,255,255,.85); }
.yr {
  font:800 10px 'Montserrat',sans-serif; letter-spacing:.18em;
  color:rgba(255,255,255,.65); border:1px solid rgba(255,255,255,.25);
  padding:4px 10px; border-radius:4px;
}

.spacer { flex:1; }

/* content block */
.content { position:relative; z-index:1; }

.dx-label {
  font:700 10px 'Montserrat',sans-serif;
  letter-spacing:.22em; text-transform:uppercase;
  color:rgba(255,255,255,.55); margin-bottom:8px;
}
.dx-name {
  font:900 62px 'Montserrat',sans-serif;
  color:#fff; letter-spacing:-.04em; line-height:.9;
  text-transform:uppercase;
  word-break:break-word; overflow-wrap:break-word;
  margin-bottom:12px;
}
.tagline {
  font:italic 20px 'Instrument Serif',serif;
  color:rgba(255,255,255,.75); line-height:1.3;
  margin-bottom:28px;
}

/* stat — compact inline */
.stat-inline {
  display:flex; align-items:center; gap:14px;
  margin-bottom:24px;
  background:rgba(0,0,0,.18); border-radius:10px;
  padding:12px 16px;
}
.stat-num { font:900 36px 'Montserrat',sans-serif; color:#fff; letter-spacing:-.03em; }
.stat-divider { width:1px; height:28px; background:rgba(255,255,255,.25); }
.stat-right {}
.stat-match { font:700 10px 'Montserrat',sans-serif; color:rgba(255,255,255,.55); letter-spacing:.08em; margin-bottom:2px; }
.stat-sev { font:800 15px 'Montserrat',sans-serif; color:#fff; text-transform:uppercase; letter-spacing:.06em; }

/* secondary — prominent chips */
.sec-title {
  font:700 10px 'Montserrat',sans-serif;
  letter-spacing:.18em; text-transform:uppercase;
  color:rgba(255,255,255,.5); margin-bottom:12px;
}
.sec-chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px; }
.sec-chip {
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px; padding:8px 14px;
  font:700 13px 'Montserrat',sans-serif; color:#fff;
}
.sec-chip-pct { font:900 15px 'Montserrat',sans-serif; color:#fff; opacity:.7; }

/* artist */
.artists {
  font:italic 18px 'Instrument Serif',serif;
  color:rgba(255,255,255,.65); margin-bottom:24px;
}
.artists b { font:800 12px 'Montserrat',sans-serif; color:#fff; font-style:normal; }

/* CTA */
.cta {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  border-radius:50px; padding:13px 16px 13px 22px;
}
.cta-text { font:800 13px 'Montserrat',sans-serif; color:#fff; }
.cta-text span { display:block; font:600 10px 'Montserrat',sans-serif; color:rgba(255,255,255,.55); letter-spacing:.08em; margin-top:1px; }
.cta-arrow {
  width:34px; height:34px; border-radius:50%;
  background:#fff; color:#2554cc;
  display:flex; align-items:center; justify-content:center;
  font:900 16px 'Montserrat',sans-serif;
}
</style>
</head>
<body>
<div class="label">B — Colour Flood</div>
<div class="card">
  <div class="deco"></div>
  <div class="deco2"></div>

  <div class="top-bar">
    <div class="wm"><span class="wm-s">wrapped</span><span class="wm-i">therapy</span></div>
    <div class="yr">2024</div>
  </div>

  <div class="spacer"></div>

  <div class="content">
    <div class="dx-label">Dr. Playlist diagnoses you with</div>
    <div class="dx-name">Depres&shy;sion</div>
    <div class="tagline">"Professional sad-song sommelier."</div>

    <div class="stat-inline">
      <div class="stat-num">87%</div>
      <div class="stat-divider"></div>
      <div class="stat-right">
        <div class="stat-match">confidence match</div>
        <div class="stat-sev">Clinical</div>
      </div>
    </div>

    <div class="sec-title">also showing up</div>
    <div class="sec-chips">
      <div class="sec-chip">Anxiety <span class="sec-chip-pct">34%</span></div>
      <div class="sec-chip">Insomnia <span class="sec-chip-pct">12%</span></div>
    </div>

    <div class="artists">thanks to <b>Olivia Rodrigo</b> &amp; <b>The Weeknd</b></div>

    <div class="cta">
      <div class="cta-text">Get your diagnosis<span>wrappedtherapy.com</span></div>
      <div class="cta-arrow">↗</div>
    </div>
  </div>
</div>
</body>
</html>
